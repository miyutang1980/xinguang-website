<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>校方家長綁定工具｜太平新光分校</title><link rel="stylesheet" href="../leave/parent-center.css"><style>main{display:block;max-width:600px}label{margin-top:16px}select{font:inherit;padding:12px;width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}code{display:block;overflow-wrap:anywhere;font-size:24px;letter-spacing:1px;margin:20px 0}button{margin-top:20px}.full{width:100%}</style><script src="./binding.js" defer></script></head><body><main><p class="eyebrow">STAFF ONLY</p><h1 style="font-size:28px;margin-bottom:20px">家長綁定碼核發</h1><section class="panel"><h2>請先核對家長身分</h2><p class="muted">僅限管理員與行政人員使用。請透過校方既有聯絡資料核驗身分，不可只憑學生姓名或自行提供的電話核發。</p><form id="issueForm"><label>校方帳號<input name="adminUser" required autocomplete="username"></label><label>校方密碼<input type="password" name="adminPass" required autocomplete="current-password"></label><label>學生編號<input name="studentNo" required autocomplete="off"></label><label>家長欄位<select name="slot"><option value="1">家長一（新主檔：媽媽）</option><option value="2">家長二（新主檔：爸爸）</option></select></label><label class="makeup"><input type="checkbox" required>已依校方既有聯絡資料核驗家長身分</label><button class="primary full" type="submit">核發 30 分鐘一次性綁定碼</button></form><div id="result" aria-live="polite"></div><p class="help">重新核發會使同一學生、同一家長欄位的未使用舊碼失效。已綁定欄位不會被覆寫，需校方另行核驗更換。</p></section></main></body></html>
